@keyframes stream { to { transform: translateX(-240px) } }
.fall .shell { animation: shake .22s steps(2, end) infinite }
@keyframes shake { 0% { transform: translate(.45px, -.35px) } 50% { transform: translate(-.45px, .35px) } }
.fall .trail path { stroke-dasharray: .16 .06; animation: trail 1.1s linear infinite; animation-delay: calc(var(--i) * -.17s) }
@keyframes trail { to { stroke-dashoffset: -.22 } }
.fall .stream path { stroke-dasharray: .07 .025; animation: streamflow 1.5s linear infinite; animation-delay: calc(var(--i) * -.11s) }
@keyframes streamflow { to { stroke-dashoffset: -.095 } }
.fall .meteor { animation: bob 2.6s ease-in-out infinite alternate }
@keyframes bob { from { transform: translateX(-5px) } to { transform: translateX(6px) } }
