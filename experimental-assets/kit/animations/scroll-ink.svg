<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 160" width="60" height="160" role="img"><title>Scroll: a ring slides down a line</title><style>.ring{animation:sc 2.4s cubic-bezier(.5,0,.75,1) infinite}@keyframes sc{0%{transform:translateY(0);opacity:0}12%{opacity:1}70%{opacity:1}100%{transform:translateY(104px);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M30 12V148" stroke="#F3F1EC" stroke-width="1.2" opacity=".5"/><path class="ring" d="M28.19 17.24A7 7 0 1 1 25.05 19.05" fill="none" stroke="#F3F1EC" stroke-width="2.6" stroke-linecap="round"/></svg>
